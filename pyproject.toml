[project]
name = "odin-rag-mcp"
version = "0.1.0"
description = "Modular RAG + MCP AI agent based on DeepWiki Open architecture principles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.0",
  "openai>=1.50.0",
  "anthropic>=0.34.0",
  "ollama>=0.3.0",
  "requests>=2.32.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
  "sentence-transformers>=3.1.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["odin_rag_mcp", "odin_rag_mcp.providers", "odin_rag_mcp.rag", "odin_rag_mcp.mcp", "api"]
