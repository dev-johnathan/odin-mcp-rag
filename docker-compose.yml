version: '3.9'

services:
  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install -r requirements.txt && uvicorn api.main:app --host 0.0.0.0 --port 8001 --reload"
    ports:
      - "8001:8001"
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 8001
      NEXT_PUBLIC_API_URL: http://localhost:8001
    env_file:
      - .env

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    depends_on:
      - api

  litellm:
    image: ghcr.io/berriai/litellm:v1.83.10-stable
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-sk-1234}
    volumes:
      - ./config/litellm-config.yml:/app/config.yaml:ro
